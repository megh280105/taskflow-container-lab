name: ci-cd

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e './backend[dev]'
      - name: Run backend tests
        run: pytest backend/tests -q

  infra-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/kubeconform
      - name: Lint Helm chart
        run: helm lint ./infra/helm/taskflow -f ./infra/helm/taskflow/values-dev.yaml
      - name: Render manifests
        run: |
          mkdir -p .tmp
          helm template taskflow ./infra/helm/taskflow -f ./infra/helm/taskflow/values-dev.yaml > .tmp/helm.yaml
          kubectl kustomize infra/k8s/base > .tmp/kustomize.yaml
      - name: Validate rendered YAML with kubeconform
        run: |
          kubeconform -summary -ignore-missing-schemas .tmp/helm.yaml
          kubeconform -summary -ignore-missing-schemas .tmp/kustomize.yaml
      - name: Validate compose file
        run: docker compose config >/tmp/taskflow-compose.yaml
      - name: Conftest policy checks
        run: |
          docker run --rm -v "$PWD":/project -w /project openpolicyagent/conftest:v0.59.0 \
            test .tmp/helm.yaml .tmp/kustomize.yaml --policy ./policy
      - name: Trivy config scan
        run: |
          docker run --rm -v "$PWD":/project aquasec/trivy:0.53.0 \
            config --exit-code 1 --severity HIGH,CRITICAL /project/infra

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container-images:
    runs-on: ubuntu-latest
    needs:
      - backend-tests
      - infra-validate
      - frontend-build
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      owner_lc: ${{ steps.meta.outputs.owner_lc }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image metadata
        id: meta
        run: |
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "owner_lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/taskflow-backend:${{ steps.meta.outputs.image_tag }}
      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.worker
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/taskflow-worker:${{ steps.meta.outputs.image_tag }}
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ steps.meta.outputs.owner_lc }}/taskflow-frontend:${{ steps.meta.outputs.image_tag }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.KUBECONFIG_B64 != ''
    runs-on: ubuntu-latest
    needs:
      - container-images
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Install kubectl
        uses: azure/setup-kubectl@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 --decode > "$HOME/.kube/config"
      - name: Deploy with Helm
        run: |
          helm upgrade --install taskflow ./infra/helm/taskflow \
            --namespace taskflow-dev \
            --create-namespace \
            -f ./infra/helm/taskflow/values-prod.yaml \
            --set backend.image.repository=ghcr.io/${{ needs.container-images.outputs.owner_lc }}/taskflow-backend \
            --set backend.image.tag=${{ needs.container-images.outputs.image_tag }} \
            --set worker.image.repository=ghcr.io/${{ needs.container-images.outputs.owner_lc }}/taskflow-worker \
            --set worker.image.tag=${{ needs.container-images.outputs.image_tag }} \
            --set frontend.image.repository=ghcr.io/${{ needs.container-images.outputs.owner_lc }}/taskflow-frontend \
            --set frontend.image.tag=${{ needs.container-images.outputs.image_tag }}
